name: Selenium App Waker

on:
  schedule:
    - cron: '0 */4 * * *' # Runs every 4 hours
  workflow_dispatch:      # Allows you to click "Run workflow" manually

jobs:
  wake_up:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Selenium and Webdriver
        run: pip install selenium webdriver-manager

      - name: Run Waker
        run: |
          python -c "
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          import time

          chrome_options = Options()
          chrome_options.add_argument('--headless')
          chrome_options.add_argument('--no-sandbox')
          chrome_options.add_argument('--window-size=1920,1080')
          driver = webdriver.Chrome(options=chrome_options)

          urls = {'FASTA': 'https://frankneuro-fasta.streamlit.app/', 'Primer': 'https://frankneuro-primer.streamlit.app/', 'qPCR': 'https://frankneuro-qpcr.streamlit.app/'}
          
          for name, url in urls.items():
              print(f'Navigating to {url}...')
              try:
                  driver.get(url)
                  # Give the app 15 seconds to finish rendering
                  time.sleep(15) 
                  
                  # Create a screenshot for the Artifacts section
                  filename = f'{name}_status.png'
                  driver.save_screenshot(filename)
                  print(f'Screenshot saved: {filename}')
                  
                  if 'Zzzz' in driver.page_source or 'Wake up' in driver.page_source:
                      print(f'Detected Sleep Page at {url}. Waking...')
                      button = driver.find_element(By.XPATH, '//button[contains(., \"back up\")]')
                      button.click()
                      time.sleep(5)
                  else:
                      print(f'App at {url} is already active.')
              except Exception as e:
                  print(f'Error at {url}: {e}')

          driver.quit()
          "

      - name: Upload Screenshot Evidence
        uses: actions/upload-artifact@v7
        with:
          name: streamlit-screenshot
          path: "*.png"
          if-no-files-found: ignore
