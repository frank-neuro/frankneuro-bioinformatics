name: Keep Streamlit Apps Awake

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch: 

jobs:
  ping_apps:
    runs-on: ubuntu-latest
    steps:
      - name: Ping FASTA and Primer Utilities
        run: |
          # We use a temporary file 'cookies.txt' to handle the session handshake
          # This prevents the redirect loop (Error 47)
          curl -L -b cookies.txt -c cookies.txt -s https://frankneuro-fasta.streamlit.app/ > /dev/null
          curl -L -b cookies.txt -c cookies.txt -s https://frankneuro-primer.streamlit.app/ > /dev/null
          echo "Handshake complete. Apps are awake."
