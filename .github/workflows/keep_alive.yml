name: Selenium App Waker

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch: 

jobs:
  wake_up:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        # Updated to v5 (Node 24 Native)
        uses: actions/checkout@v5

      - name: Set up Python
        # Updated to v6 (Node 24 Native)
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Selenium and Webdriver
        run: pip install selenium webdriver-manager

      - name: Run Waker
        run: |
          python -c "
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          import time

          chrome_options = Options()
          chrome_options.add_argument('--headless')
          chrome_options.add_argument('--no-sandbox')
          chrome_options.add_argument('--window-size=1920,1080')
          driver = webdriver.Chrome(options=chrome_options)

          urls = ['https://frankneuro-fasta.streamlit.app/', 'https://frankneuro-primer.streamlit.app/']
          
          for url in urls:
              print(f'Navigating to {url}...')
              try:
                  driver.get(url)
                  time.sleep(15) 
                  
                  if 'Zzzz' in driver.page_source or 'Wake up' in driver.page_source:
                      print(f'Detected Sleep Page at {url}. Attempting to wake...')
                      # Standard Streamlit Cloud wake-up button selector
                      button = driver.find_element(By.XPATH, '//button[contains(., \"back up\")]')
                      button.click()
                      print('Clicked wake button.')
                      time.sleep(5)
                  else:
                      print(f'App at {url} is already active.')
              except Exception as e:
                  print(f'Error visiting {url}: {e}')

          driver.quit()
          "

      - name: Upload Screenshot Evidence
        # Updated to v7 (Latest 2026 release)
        uses: actions/upload-artifact@v7
        with:
          name: streamlit-screenshot
          path: "*.png"
          if-no-files-found: ignore
