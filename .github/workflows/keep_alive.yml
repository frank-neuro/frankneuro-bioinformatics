name: Keep Streamlit Apps Awake

on:
  schedule:
    # Runs every 4 hours to stay well within the 12-hour sleep window
    - cron: '0 */4 * * *'
  workflow_dispatch: 

jobs:
  ping_apps:
    runs-on: ubuntu-latest
    steps:
      - name: Ping FASTA and Primer Utilities
        run: |
          # -L follows the 303 redirect to the actual app
          # -s hides the progress bar for a cleaner log
          curl -L -s https://frankneuro-fasta.streamlit.app/ > /dev/null
          curl -L -s https://frankneuro-primer.streamlit.app/ > /dev/null
          echo "Ping successful. Utilities are awake."
